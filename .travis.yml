language: java

cache:
  directories:
    - $HOME/.m2

jdk:
  - openjdk8
  - openjdk11
  - openjdk-ea
  - oraclejdk11

matrix:
  exclude:
    - jdk: openjdk-ea
  include:
    - jdk: openjdk-ea
      env: JACOCO_SKIP=true
    # Travis can no longer provision openjdk14 (install-jdk.sh fails on focal);
    # install the JDK 14 GA build from Azul instead.
    - name: openjdk14
      jdk: openjdk11
      before_install:
        - curl -sSfL https://cdn.azul.com/zulu/bin/zulu14.29.23-ca-jdk14.0.2-linux_x64.tar.gz | tar xz -C $HOME
        - export JAVA_HOME=$HOME/zulu14.29.23-ca-jdk14.0.2-linux_x64
        - export PATH=$JAVA_HOME/bin:$PATH
        - java -version

# --no-transfer-progress requires Maven 3.6.1+. Otherwise use --batch-mode
script:
  - mvn -V --no-transfer-progress -Drat.skip=true -Djapicmp.skip=true -Dcheckstyle.skip=true -Djacoco.skip=true -Dmaven.javadoc.skip=true
  # Name every skipped test and its reason (surefire prints only a count)
  - python3 -c "import glob,xml.etree.ElementTree as E;[print('SKIPPED', c.get('classname')+'.'+c.get('name'), '-', s.get('message') or 'no message') for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')) for c in E.parse(f).iter('testcase') for s in c.findall('skipped')]"
